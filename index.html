 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Notes Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #1e293b;
      padding: 1.5rem 2rem;
      border-bottom: 2px solid #334155;
      text-align: center;
    }

    header h1 {
      color: #38bdf8;
      font-size: 2rem;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .main-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      color: #38bdf8;
      font-size: 1.3rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn {
      padding: 0.75rem 1.2rem;
      border: none;
      border-radius: 8px;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #7dd3fc;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Notes Display List */
    .notes-list, .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .note-item {
      background-color: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
      position: relative;
    }

    .note-item h4 {
      color: #f8fafc;
      margin-bottom: 0.25rem;
    }

    .note-item .subject-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .note-item p {
      color: #cbd5e1;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }

    .delete-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: none;
      border: none;
      color: #f43f5e;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }

    /* Tasks List */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
    }

    .task-item span {
      font-size: 0.95rem;
    }

    .task-item span.completed {
      text-decoration: line-through;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <h1>📓 Fair Notes & Study Hub</h1>
    <p>Organize subject notes, track study goals, and draft quick thoughts in one place.</p>
  </header>

  <div class="main-container">

    <div class="card">
      <h2>Add Fair Note</h2>
      <input type="text" id="note-title" placeholder="Note Title (e.g., Chapter 3 Summary)">
      <select id="note-subject">
        <option value="Science">Science</option>
        <option value="Mathematics">Mathematics</option>
        <option value="English">English</option>
        <option value="Operating System">Operating System</option>
        <option value="JavaScript">JavaScript</option>
         value="Computer Organization and Architecture">Computer Organization and Architecture</option>
      </select>
      <textarea id="note-body" placeholder="Write clean, fair notes here..."></textarea>
      <button class="btn" onclick="saveNote()">Save Note</button>
    </div>

    <div class="card">
      <h2>Your Saved Notes</h2>
      <div class="notes-list" id="notes-container">
        </div>
    </div>

    <div class="card">
      <h2>Study Checklist</h2>
      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="task-input" placeholder="New task...">
        <button class="btn" onclick="addTask()">Add</button>
      </div>
      <div class="task-list" id="tasks-container">
        </div>

      <h2 style="margin-top: 1rem;">Quick Scratchpad</h2>
      <textarea id="scratchpad" placeholder="Rough notes, quick ideas..." oninput="saveScratchpad()"></textarea>
    </div>

  </div>

  <script>
    // Load stored data on page start
    document.addEventListener('DOMContentLoaded', () => {
      displayNotes();
      displayTasks();
      document.getElementById('scratchpad').value = localStorage.getItem('hub_scratchpad') || '';
    });

    /* --- NOTES LOGIC --- */
    function getNotes() {
      return JSON.parse(localStorage.getItem('hub_notes') || '[]');
    }

    function saveNote() {
      const title = document.getElementById('note-title').value.trim();
      const subject = document.getElementById('note-subject').value;
      const body = document.getElementById('note-body').value.trim();

      if (!title || !body) {
        alert('Please enter both a title and note content!');
        return;
      }

      const notes = getNotes();
      notes.push({ id: Date.now(), title, subject, body });
      localStorage.setItem('hub_notes', JSON.stringify(notes));

      document.getElementById('note-title').value = '';
      document.getElementById('note-body').value = '';
      displayNotes();
    }

    function deleteNote(id) {
      const notes = getNotes().filter(note => note.id !== id);
      localStorage.setItem('hub_notes', JSON.stringify(notes));
      displayNotes();
    }

    function displayNotes() {
      const container = document.getElementById('notes-container');
      const notes = getNotes();

      if (notes.length === 0) {
        container.innerHTML = '<p style="color: #64748b; text-align: center;">No fair notes added yet.</p>';
        return;
      }

      container.innerHTML = notes.map(note => `
        <div class="note-item">
          <span class="subject-tag">${note.subject}</span>
          <button class="delete-btn" onclick="deleteNote(${note.id})">✕</button>
          <h4>${escapeHTML(note.title)}</h4>
          <p>${escapeHTML(note.body)}</p>
        </div>
      `).join('');
    }

    /* --- TASKS LOGIC --- */
    function getTasks() {
      return JSON.parse(localStorage.getItem('hub_tasks') || '[]');
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      const tasks = getTasks();
      tasks.push({ id: Date.now(), text, done: false });
      localStorage.setItem('hub_tasks', JSON.stringify(tasks));
      input.value = '';
      displayTasks();
    }

    function toggleTask(id) {
      const tasks = getTasks().map(task => {
        if (task.id === id) task.done = !task.done;
        return task;
      });
      localStorage.setItem('hub_tasks', JSON.stringify(tasks));
      displayTasks();
    }

    function deleteTask(id) {
      const tasks = getTasks().filter(task => task.id !== id);
      localStorage.setItem('hub_tasks', JSON.stringify(tasks));
      displayTasks();
    }

    function displayTasks() {
      const container = document.getElementById('tasks-container');
      const tasks = getTasks();

      if (tasks.length === 0) {
        container.innerHTML = '<p style="color: #64748b; text-align: center;">No pending tasks.</p>';
        return;
      }

      container.innerHTML = tasks.map(task => `
        <div class="task-item">
          <span class="${task.done ? 'completed' : ''}" onclick="toggleTask(${task.id})" style="cursor:pointer;">
            ${task.done ? '✓ ' : '○ '} ${escapeHTML(task.text)}
          </span>
          <button class="delete-btn" style="position:static;" onclick="deleteTask(${task.id})">✕</button>
        </div>
      `).join('');
    }

    /* --- SCRATCHPAD LOGIC --- */
    function saveScratchpad() {
      const text = document.getElementById('scratchpad').value;
      localStorage.setItem('hub_scratchpad', text);
    }

    // Utility to prevent code injection
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
